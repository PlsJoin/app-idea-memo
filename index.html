<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メモ帳</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0067c0">
<style>
  :root{
    --bg:#f7f7f7; --panel:#ffffff; --ink:#1b1b1b; --sub:#616161;
    --line:#d8d8d8; --rule:#f2f2f2; --accent:#0067c0; --accent-soft:#e7f0fa;
    --paper:#ffffff;
  }
  body.dark{
    --bg:#202020; --panel:#2b2b2b; --ink:#f5f5f5; --sub:#a3a3a3;
    --line:#4a4a4a; --rule:#2f2f2f; --accent:#4cc2ff; --accent-soft:#333a42;
    --paper:#282828;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI","Yu Gothic UI","Meiryo",sans-serif;
    background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column;}
  header{display:flex; align-items:center; gap:8px; padding:8px 14px;
    background:var(--panel); border-bottom:1px solid var(--line);}
  header h1{font-size:14px; font-weight:600;}
  header .spacer{flex:1;}
  button, select{font:inherit; font-size:13px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); border-radius:2px; padding:5px 11px;}
  button{cursor:pointer;}
  button:hover, select:hover{background:var(--accent-soft);}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.fmt{font-size:14px; min-width:34px; padding:4px 0;}
  button.fmt b{font-weight:700;}
  button.fmt i{font-style:italic; font-family:Georgia,serif;}
  button.fmt u{text-decoration:underline;}
  button.fmt.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  main{flex:1; display:flex; min-height:0;}
  #sidebar{width:260px; border-right:1px solid var(--line); background:var(--panel);
    display:flex; flex-direction:column;}
  #search{margin:10px; padding:7px 9px; border:1px solid var(--line); border-radius:2px;
    background:var(--paper); color:var(--ink); font:inherit; font-size:13px; width:calc(100% - 20px);}
  #list{flex:1; overflow-y:auto;}
  .item{position:relative; padding:9px 48px 9px 14px; border-bottom:1px solid var(--line); cursor:grab;}
  .item:hover{background:var(--accent-soft);}
  .item.active{background:var(--accent-soft); border-left:3px solid var(--accent);}
  .item.dragging{opacity:.45;}
  .item.drop-before{box-shadow:inset 0 2px 0 var(--accent);}
  .item.drop-after{box-shadow:inset 0 -2px 0 var(--accent);}
  .item .t{font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item .p{font-size:12px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
  .item .d{font-size:11px; color:var(--sub); margin-top:3px;}
  .item .pin{font-size:11px; color:var(--accent); margin-left:6px;}
  .item .item-del{position:absolute; right:8px; top:8px; font-size:11px; padding:2px 7px; display:none;}
  .item:hover .item-del{display:block;}
  #empty{padding:24px 14px; color:var(--sub); font-size:13px; text-align:center;}
  #editor{flex:1; display:flex; flex-direction:column; background:var(--paper); min-width:0;}
  #toolbar{display:flex; align-items:center; gap:6px; padding:7px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  #toolbar label{font-size:12px; color:var(--sub);}
  #status{font-size:12px; color:var(--sub);}
  #toolbar .spacer{flex:1;}
  #toolbar .sep{width:1px; height:20px; background:var(--line); margin:0 4px;}
  #body{flex:1; overflow-y:auto; outline:none; padding:8px 22px;
    font-size:15px; line-height:30px; color:var(--ink);
    background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 29px, var(--rule) 29px, var(--rule) 30px);
    background-size:100% 30px; background-position:0 8px; background-attachment:local;}
  #body[data-empty="true"]:before{content:attr(data-placeholder); color:var(--sub); pointer-events:none;}
  #count{padding:5px 14px; font-size:12px; color:var(--sub); border-top:1px solid var(--line); text-align:right;}
  @media (max-width:700px){
    #sidebar{width:150px;}
    #body{padding:8px 12px;}
  }
</style>
</head>
<body>
<header>
  <h1>メモ帳</h1>
  <div class="spacer"></div>
  <button id="installBtn" style="display:none">このPCにインストール</button>
  <button id="themeBtn">ダークモード</button>
</header>
<main>
  <aside id="sidebar">
    <input id="search" type="search" placeholder="メモを検索">
    <div style="padding:0 10px 10px;"><button id="newBtn" class="primary" style="width:100%">+ 新しいメモ</button></div>
    <div id="list"></div>
    <div id="empty" style="display:none">メモがありません。</div>
  </aside>
  <section id="editor">
    <div id="toolbar">
      <label for="fontSize">文字サイズ</label>
      <select id="fontSize">
        <option value="13">13</option>
        <option value="14">14</option>
        <option value="15" selected>15</option>
        <option value="16">16</option>
        <option value="18">18</option>
        <option value="20">20</option>
        <option value="22">22</option>
        <option value="24">24</option>
      </select>
      <div class="sep"></div>
      <button class="fmt" id="boldBtn" title="太字 (Ctrl+B)"><b>B</b></button>
      <button class="fmt" id="italicBtn" title="斜体 (Ctrl+I)"><i>I</i></button>
      <button class="fmt" id="underBtn" title="下線 (Ctrl+U)"><u>U</u></button>
      <button class="fmt" id="strikeBtn" title="取り消し線"><s>S</s></button>
      <div class="sep"></div>
      <span id="status">メモを選ぶか、新しく作成してください</span>
      <div class="spacer"></div>
      <button id="pinBtn">固定</button>
      <button id="dlBtn">テキストで保存</button>
      <button id="delBtn">削除</button>
    </div>
    <div id="body" contenteditable="true" data-placeholder="ここに入力してください。最初の1行がタイトルになります。入力するたびに自動で保存されます。"></div>
    <div id="count">0文字</div>
  </section>
</main>
<script>
const KEY = "nice-notepad-v1";
const CURKEY = "nice-notepad-current";
const FONTKEY = "nice-notepad-fontsize";
let notes = [];
try { notes = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e) { notes = []; }
for (const n of notes){ if (n.html === undefined){ n.html = escapeHtml(n.text || "").replace(/\n/g, "<br>"); delete n.text; } }
if (notes.some(n => typeof n.order !== "number")){
  [...notes].sort((a,b) => (b.pinned - a.pinned) || (b.updated - a.updated))
    .forEach((n,i) => { if (typeof n.order !== "number") n.order = i * 10; });
}
let currentId = null;
let query = "";
let dragId = null;

const $ = (id) => document.getElementById(id);
const listEl = $("list"), bodyEl = $("body"), statusEl = $("status"), countEl = $("count");

function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function htmlToText(html){
  let t = (html || "")
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/(div|p|li)>/gi, "\n")
    .replace(/<[^>]+>/g, "");
  const ta = document.createElement("textarea"); ta.innerHTML = t; t = ta.value;
  return t.replace(/\n+$/, "");
}
function save(){ localStorage.setItem(KEY, JSON.stringify(notes)); }
function saveCurrent(){ if (currentId !== null) localStorage.setItem(CURKEY, String(currentId)); }
function current(){ return notes.find(n => n.id === currentId) || null; }
function byOrder(){ return [...notes].sort((a,b) => a.order - b.order); }
function titleOf(n){
  const first = htmlToText(n.html).split("\n").find(l => l.trim() !== "");
  return first ? first.trim().slice(0, 40) : "(無題)";
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.getFullYear() + "/" + (d.getMonth()+1) + "/" + d.getDate() + " " +
         String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function openNote(id){
  currentId = id; saveCurrent();
  const c = current();
  bodyEl.innerHTML = c ? c.html : "";
  updateCount(); render(); updateFmtState();
}
function render(){
  const items = byOrder().filter(n => !query || htmlToText(n.html).includes(query));
  listEl.innerHTML = "";
  $("empty").style.display = notes.length ? "none" : "block";
  for (const n of items){
    const div = document.createElement("div");
    div.className = "item" + (n.id === currentId ? " active" : "");
    div.draggable = true;
    div.title = "ドラッグで並び替え";
    const text = htmlToText(n.html);
    const preview = text.split("\n").slice(1).join(" ").trim().slice(0, 50);
    const t = document.createElement("div"); t.className = "t"; t.textContent = titleOf(n);
    if (n.pinned){ const p = document.createElement("span"); p.className = "pin"; p.textContent = "固定中"; t.appendChild(p); }
    const pv = document.createElement("div"); pv.className = "p"; pv.textContent = preview || "(本文なし)";
    const dt = document.createElement("div"); dt.className = "d"; dt.textContent = fmtDate(n.updated);
    const del = document.createElement("button");
    del.className = "item-del"; del.textContent = "削除"; del.draggable = false;
    del.onclick = (e) => { e.stopPropagation(); deleteNote(n.id); };
    div.append(t, pv, dt, del);
    div.onclick = () => openNote(n.id);
    div.addEventListener("dragstart", (e) => {
      dragId = n.id; div.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", String(n.id));
    });
    div.addEventListener("dragend", () => {
      dragId = null;
      listEl.querySelectorAll(".item").forEach(el => el.classList.remove("dragging","drop-before","drop-after"));
    });
    div.addEventListener("dragover", (e) => {
      if (dragId === null || dragId === n.id) return;
      e.preventDefault();
      const r = div.getBoundingClientRect();
      const after = (e.clientY - r.top) > r.height / 2;
      div.classList.toggle("drop-after", after);
      div.classList.toggle("drop-before", !after);
    });
    div.addEventListener("dragleave", () => div.classList.remove("drop-before","drop-after"));
    div.addEventListener("drop", (e) => {
      e.preventDefault();
      if (dragId === null || dragId === n.id) return;
      const r = div.getBoundingClientRect();
      const after = (e.clientY - r.top) > r.height / 2;
      const arr = byOrder();
      const from = arr.findIndex(x => x.id === dragId);
      const [moved] = arr.splice(from, 1);
      let to = arr.findIndex(x => x.id === n.id);
      if (after) to += 1;
      arr.splice(to, 0, moved);
      arr.forEach((x,i) => x.order = i * 10);
      save(); render();
    });
    listEl.appendChild(div);
  }
  const c = current();
  statusEl.textContent = c ? "最終保存 " + fmtDate(c.updated) : "メモを選ぶか、新しく作成してください";
}
function updateCount(){
  const text = htmlToText(bodyEl.innerHTML);
  countEl.textContent = text.length + "文字";
  bodyEl.dataset.empty = text.trim() === "" ? "true" : "false";
}
function deleteNote(id){
  const n = notes.find(x => x.id === id);
  if (!n) return;
  if (!confirm("「" + titleOf(n) + "」を削除しますか?")) return;
  notes = notes.filter(x => x.id !== id);
  save();
  if (id === currentId){
    const rest = byOrder();
    if (rest.length) openNote(rest[0].id);
    else { currentId = null; bodyEl.innerHTML = ""; render(); updateCount(); }
  } else render();
}
$("newBtn").onclick = () => {
  const minOrder = notes.length ? Math.min(...notes.map(n => n.order)) : 0;
  const n = { id: Date.now(), html: "", updated: Date.now(), pinned: false, order: minOrder - 10 };
  notes.unshift(n); save(); openNote(n.id); bodyEl.focus();
};
let timer = null;
function handleInput(){
  const c = current(); if (!c) return;
  c.html = bodyEl.innerHTML; c.updated = Date.now();
  updateCount();
  statusEl.textContent = "保存中...";
  clearTimeout(timer);
  timer = setTimeout(() => { save(); render(); }, 300);
}
bodyEl.addEventListener("input", handleInput);
$("search").addEventListener("input", (e) => { query = e.target.value; render(); });
$("pinBtn").onclick = () => {
  const c = current(); if (!c) return;
  c.pinned = !c.pinned; save(); render();
};
$("delBtn").onclick = () => { if (currentId !== null) deleteNote(currentId); };
$("dlBtn").onclick = () => {
  const c = current(); if (!c) return;
  const blob = new Blob([htmlToText(c.html)], {type: "text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = titleOf(c).replace(/[\\/:*?"<>|]/g, "_") + ".txt";
  a.click(); URL.revokeObjectURL(a.href);
};
const FMT_BTNS = [["boldBtn","bold"],["italicBtn","italic"],["underBtn","underline"],["strikeBtn","strikeThrough"]];
function updateFmtState(){
  const sel = window.getSelection();
  const inside = sel && sel.anchorNode && bodyEl.contains(sel.anchorNode);
  for (const [id, cmd] of FMT_BTNS){
    let on = false;
    if (inside){ try { on = document.queryCommandState(cmd); } catch(e) { on = false; } }
    $(id).classList.toggle("on", !!on);
  }
}
function fmt(cmd){
  return (e) => {
    e.preventDefault();
    const sel = window.getSelection();
    const collapsed = !sel || sel.isCollapsed;
    bodyEl.focus();
    document.execCommand(cmd, false, null);
    if (!collapsed) handleInput();
    setTimeout(updateFmtState, 0);
  };
}
for (const [id, cmd] of FMT_BTNS) $(id).addEventListener("mousedown", fmt(cmd));
document.addEventListener("selectionchange", updateFmtState);
bodyEl.addEventListener("keyup", updateFmtState);
bodyEl.addEventListener("mouseup", updateFmtState);
function applyFontSize(px){
  const lh = Math.round(px * 2);
  const rule = getComputedStyle(document.body).getPropertyValue("--rule").trim() || "#f2f2f2";
  bodyEl.style.fontSize = px + "px";
  bodyEl.style.lineHeight = lh + "px";
  bodyEl.style.backgroundSize = "100% " + lh + "px";
  bodyEl.style.backgroundImage = "repeating-linear-gradient(to bottom, transparent 0, transparent " + (lh - 1) + "px, " + rule + " " + (lh - 1) + "px, " + rule + " " + lh + "px)";
}
const fontSel = $("fontSize");
let fontPx = Number(localStorage.getItem(FONTKEY) || "15");
if (![...fontSel.options].some(o => Number(o.value) === fontPx)) fontPx = 15;
fontSel.value = String(fontPx);
applyFontSize(fontPx);
fontSel.addEventListener("change", () => {
  fontPx = Number(fontSel.value);
  localStorage.setItem(FONTKEY, String(fontPx));
  applyFontSize(fontPx);
  bodyEl.focus();
});
$("themeBtn").onclick = () => {
  document.body.classList.toggle("dark");
  localStorage.setItem("nice-notepad-theme", document.body.classList.contains("dark") ? "dark" : "light");
  applyFontSize(fontPx);
};
if (localStorage.getItem("nice-notepad-theme") === "dark"){ document.body.classList.add("dark"); applyFontSize(fontPx); }

if (!notes.length){
  const n = { id: Date.now(), html: "使い方<br><br>・入力するたびに自動で保存されます<br>・文字サイズはツールバーの「文字サイズ」から変更できます<br>・太字(B)、斜体(I)、下線(U)、取り消し線(S)が使えます。ボタンが青くなっている間が有効で、もう一度押すと解除されます。Ctrl+B / Ctrl+I でも切り替えできます<br>・左のメモはドラッグで並び替えでき、メモにカーソルを合わせると「削除」ボタンが出ます<br>・「固定」でメモに固定中マークが付きます<br>・「テキストで保存」で .txt ファイルとして書き出せます<br>・閉じて開き直しても、最後に開いていたメモが表示されます", updated: Date.now(), pinned: true, order: 0 };
  notes.push(n); save();
}
const lastId = Number(localStorage.getItem(CURKEY) || "");
if (lastId && notes.some(n => n.id === lastId)) openNote(lastId);
else if (notes.length) openNote(byOrder()[0].id);
else { render(); updateCount(); }

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault(); deferredPrompt = e; $("installBtn").style.display = "";
});
$("installBtn").onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null;
  $("installBtn").style.display = "none";
};
</script>
</body>
</html>
