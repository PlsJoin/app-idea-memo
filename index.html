<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メモ帳</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4a6fa5">
<style>
  :root{
    --bg:#f4f1ea; --panel:#fffdf8; --ink:#2b2b2b; --sub:#8a8378;
    --line:#e5ddcb; --accent:#4a6fa5; --accent-soft:#e8eef6;
    --paper:#fffef9; --shadow:0 2px 10px rgba(60,50,20,.08);
  }
  body.dark{
    --bg:#1d1f24; --panel:#26282e; --ink:#e8e6e1; --sub:#9a97a3;
    --line:#3a3d44; --accent:#7ea4d8; --accent-soft:#2f3a4d;
    --paper:#2b2d33; --shadow:0 2px 10px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
    background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column;}
  header{display:flex; align-items:center; gap:10px; padding:10px 16px;
    background:var(--panel); border-bottom:1px solid var(--line);}
  header h1{font-size:17px; font-weight:700; letter-spacing:.05em;}
  header .spacer{flex:1;}
  button{font:inherit; cursor:pointer; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); border-radius:8px; padding:6px 12px;}
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;}
  main{flex:1; display:flex; min-height:0;}
  #sidebar{width:270px; border-right:1px solid var(--line); background:var(--panel);
    display:flex; flex-direction:column;}
  #search{margin:10px; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
    background:var(--paper); color:var(--ink); font:inherit; width:calc(100% - 20px);}
  #list{flex:1; overflow-y:auto;}
  .item{padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer;}
  .item:hover{background:var(--accent-soft);}
  .item.active{background:var(--accent-soft); border-left:3px solid var(--accent);}
  .item .t{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item .p{font-size:12px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
  .item .d{font-size:11px; color:var(--sub); margin-top:3px;}
  .item .pin{float:right;}
  #empty{padding:24px 14px; color:var(--sub); font-size:13px; text-align:center;}
  #editor{flex:1; display:flex; flex-direction:column; background:var(--paper); min-width:0;}
  #toolbar{display:flex; align-items:center; gap:8px; padding:8px 14px; border-bottom:1px solid var(--line);}
  #status{font-size:12px; color:var(--sub);}
  #toolbar .spacer{flex:1;}
  #body{flex:1; border:none; outline:none; resize:none; padding:20px 26px;
    font:inherit; font-size:16px; line-height:1.9; background:transparent; color:var(--ink);
    background-image:repeating-linear-gradient(transparent, transparent calc(1.9em - 1px), var(--line) calc(1.9em - 1px), var(--line) 1.9em);
    background-attachment:local;}
  #count{padding:6px 14px; font-size:12px; color:var(--sub); border-top:1px solid var(--line); text-align:right;}
  @media (max-width:700px){
    #sidebar{width:150px;}
    #body{padding:14px;}
  }
</style>
</head>
<body>
<header>
  <h1>📝 メモ帳</h1>
  <div class="spacer"></div>
  <button id="installBtn" style="display:none">⬇ このPCにインストール</button>
  <button id="themeBtn" title="ダークモード切替">🌙</button>
</header>
<main>
  <aside id="sidebar">
    <input id="search" type="search" placeholder="メモを検索…">
    <div style="padding:0 10px 10px;"><button id="newBtn" class="primary" style="width:100%">＋ 新しいメモ</button></div>
    <div id="list"></div>
    <div id="empty" style="display:none">メモがありません。<br>「＋ 新しいメモ」からどうぞ。</div>
  </aside>
  <section id="editor">
    <div id="toolbar">
      <span id="status">メモを選ぶか、新しく作ってね</span>
      <div class="spacer"></div>
      <button id="pinBtn" title="ピン留め">📌 ピン</button>
      <button id="dlBtn" title="テキストファイルで保存">⬇ .txt保存</button>
      <button id="delBtn" title="削除">🗑 削除</button>
    </div>
    <textarea id="body" placeholder="ここに書いてね。最初の1行がタイトルになります。書くたび自動で保存されます。"></textarea>
    <div id="count">0文字</div>
  </section>
</main>
<script>
const KEY = "nice-notepad-v1";
let notes = [];
try { notes = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e) { notes = []; }
let currentId = null;
let query = "";

const $ = (id) => document.getElementById(id);
const listEl = $("list"), bodyEl = $("body"), statusEl = $("status"), countEl = $("count");

function save(){ localStorage.setItem(KEY, JSON.stringify(notes)); }
function current(){ return notes.find(n => n.id === currentId) || null; }
function titleOf(n){
  const first = (n.text || "").split("\n").find(l => l.trim() !== "");
  return first ? first.trim().slice(0, 40) : "（無題）";
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.getFullYear() + "/" + (d.getMonth()+1) + "/" + d.getDate() + " " +
         String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function render(){
  const items = notes
    .filter(n => !query || n.text.includes(query))
    .sort((a,b) => (b.pinned - a.pinned) || (b.updated - a.updated));
  listEl.innerHTML = "";
  $("empty").style.display = notes.length ? "none" : "block";
  for (const n of items){
    const div = document.createElement("div");
    div.className = "item" + (n.id === currentId ? " active" : "");
    const preview = n.text.split("\n").slice(1).join(" ").trim().slice(0, 50);
    div.innerHTML = "";
    const t = document.createElement("div"); t.className = "t"; t.textContent = titleOf(n);
    if (n.pinned){ const p = document.createElement("span"); p.className = "pin"; p.textContent = "📌"; t.appendChild(p); }
    const pv = document.createElement("div"); pv.className = "p"; pv.textContent = preview || "（本文なし）";
    const dt = document.createElement("div"); dt.className = "d"; dt.textContent = fmtDate(n.updated);
    div.append(t, pv, dt);
    div.onclick = () => { currentId = n.id; bodyEl.value = n.text; updateCount(); render(); };
    listEl.appendChild(div);
  }
  const c = current();
  statusEl.textContent = c ? "最終保存 " + fmtDate(c.updated) : "メモを選ぶか、新しく作ってね";
}
function updateCount(){
  const len = bodyEl.value.length;
  countEl.textContent = len + "文字";
}
$("newBtn").onclick = () => {
  const n = { id: Date.now(), text: "", updated: Date.now(), pinned: false };
  notes.unshift(n); currentId = n.id; bodyEl.value = "";
  save(); render(); updateCount(); bodyEl.focus();
};
let timer = null;
bodyEl.addEventListener("input", () => {
  const c = current(); if (!c) return;
  c.text = bodyEl.value; c.updated = Date.now();
  updateCount();
  statusEl.textContent = "保存中…";
  clearTimeout(timer);
  timer = setTimeout(() => { save(); render(); }, 300);
});
$("search").addEventListener("input", (e) => { query = e.target.value; render(); });
$("pinBtn").onclick = () => {
  const c = current(); if (!c) return;
  c.pinned = !c.pinned; save(); render();
};
$("delBtn").onclick = () => {
  const c = current(); if (!c) return;
  if (!confirm("このメモを削除しますか？")) return;
  notes = notes.filter(n => n.id !== c.id);
  currentId = notes.length ? notes[0].id : null;
  bodyEl.value = current() ? current().text : "";
  save(); render(); updateCount();
};
$("dlBtn").onclick = () => {
  const c = current(); if (!c) return;
  const blob = new Blob([c.text], {type: "text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = titleOf(c).replace(/[\\/:*?"<>|]/g, "_") + ".txt";
  a.click(); URL.revokeObjectURL(a.href);
};
$("themeBtn").onclick = () => {
  document.body.classList.toggle("dark");
  localStorage.setItem("nice-notepad-theme", document.body.classList.contains("dark") ? "dark" : "light");
};
if (localStorage.getItem("nice-notepad-theme") === "dark") document.body.classList.add("dark");

if (!notes.length){
  const n = { id: Date.now(), text: "はじめまして！\n\nこれはちょっと良い感じのメモ帳です。\n・書くたびに自動で保存されます\n・左の一覧からメモを切り替えられます\n・📌ピン留めで大事なメモを上に固定できます\n・⬇ .txt保存でテキストファイルとして書き出せます\n・🌙ボタンでダークモードになります\n\nWindows標準メモ帳の代わりに、気軽に使ってね。", updated: Date.now(), pinned: true };
  notes.push(n); currentId = n.id; bodyEl.value = n.text; save();
}
render(); updateCount();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault(); deferredPrompt = e; $("installBtn").style.display = "";
});
$("installBtn").onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null;
  $("installBtn").style.display = "none";
};
</script>
</body>
</html>
